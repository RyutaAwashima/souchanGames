<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102d57">
  <title>ポポのそらたび</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      background: #102d57;
      color: #fff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      background: #102d57;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    main {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #092145b8;
      text-align: center;
    }

    .overlay[hidden] { display: none; }

    .card {
      width: min(100%, 440px);
      padding: clamp(24px, 7vw, 40px);
      border: 4px solid #fff;
      border-radius: 32px;
      background: linear-gradient(155deg, #4ca4e4, #725ed6);
      box-shadow: 0 14px 0 #253b8b;
    }

    .card h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 9vw, 3rem);
      line-height: 1.2;
      text-shadow: 0 4px 0 #284c9c;
    }

    .card p {
      margin: 0 0 22px;
      font-size: clamp(1rem, 4.5vw, 1.2rem);
      line-height: 1.8;
      white-space: pre-line;
    }

    button {
      min-width: 190px;
      min-height: 68px;
      border: 4px solid #fff;
      border-radius: 24px;
      background: #ffcf57;
      box-shadow: 0 6px 0 #d9962d;
      color: #493416;
      font: inherit;
      font-size: 1.35rem;
      font-weight: 900;
      touch-action: manipulation;
    }

    button:active { transform: translateY(4px); box-shadow: 0 2px 0 #d9962d; }
    button:focus-visible { outline: 4px solid #b9f5ff; outline-offset: 5px; }
    .card .secondary-button {
      min-height: 52px;
      margin: 18px 0 0 8px;
      padding: 10px 18px;
      border-width: 2px;
      background: #b9f5ff;
      box-shadow: 0 4px 0 #65b5cf;
      font-size: 1.05rem;
    }
    .card .secondary-button:active { box-shadow: 0 2px 0 #65b5cf; }
    .card .secondary-button[hidden] { display: none; }

    .message {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      z-index: 1;
      width: max-content;
      max-width: calc(100% - 32px);
      transform: translateX(-50%);
      padding: 10px 18px;
      border: 3px solid #fff;
      border-radius: 22px;
      background: #173f83eF;
      box-shadow: 0 4px 0 #0b2454;
      color: #fff;
      font-size: clamp(.95rem, 4vw, 1.15rem);
      font-weight: 800;
      text-align: center;
      pointer-events: none;
    }

    .message[hidden] { display: none; }

    .home {
      position: absolute;
      right: max(12px, env(safe-area-inset-right));
      top: max(84px, calc(env(safe-area-inset-top) + 72px));
      z-index: 1;
      padding: 9px 14px;
      border: 2px solid #fff;
      border-radius: 18px;
      background: #173f83dd;
      color: #fff;
      font-size: .95rem;
      font-weight: 700;
      text-decoration: none;
      touch-action: manipulation;
    }

    .home:focus-visible { outline: 3px solid #ffcf57; outline-offset: 3px; }

    .sound-toggle {
      position: absolute;
      top: max(142px, calc(env(safe-area-inset-top) + 130px));
      right: max(12px, env(safe-area-inset-right));
      z-index: 1;
      min-width: 82px;
      min-height: 42px;
      padding: 7px 12px;
      border: 2px solid #fff;
      border-radius: 18px;
      background: #173f83dd;
      box-shadow: none;
      color: #fff;
      font-size: .95rem;
      font-weight: 700;
      touch-action: manipulation;
    }

    .sound-toggle:focus-visible { outline: 3px solid #ffcf57; outline-offset: 3px; }

    @media (max-height: 520px) {
      .card { padding: 18px 24px; }
      .card h1 { font-size: 2rem; }
      .card p { margin-bottom: 12px; line-height: 1.5; }
      button { min-height: 56px; }
    }
  </style>
</head>
<body>
  <main>
    <canvas id="game" aria-label="ポポのそらたび。画面をタップしてレーンを移動し、敵に星パンチを当てます。"></canvas>
    <div class="message" id="message" role="status" aria-live="polite" hidden></div>
    <a class="home" href="../../index.html">おうちへ</a>
    <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="true">🔊 おと</button>
    <section class="overlay" id="overlay">
      <div class="card">
        <h1 id="overlay-title">ポポのそらたび</h1>
        <p id="overlay-text">タップでレーンをえらんで<br>そのまま星パンチ！</p>
        <button id="overlay-button" type="button">あそぶ</button>
        <button class="secondary-button" id="overlay-secondary-button" type="button" hidden></button>
      </div>
    </section>
  </main>
  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayText = document.getElementById("overlay-text");
      const overlayButton = document.getElementById("overlay-button");
      const overlaySecondaryButton = document.getElementById("overlay-secondary-button");
      const message = document.getElementById("message");
      const soundToggle = document.getElementById("sound-toggle");
      const TAU = Math.PI * 2;
      const stars = Array.from({ length: 48 }, (_, i) => ({
        x: ((i * 73 + 17) % 997) / 997,
        y: ((i * 137 + 41) % 991) / 991,
        size: 1 + (i % 3),
        speed: 25 + (i % 5) * 12
      }));

      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let mode = "menu";
      let stage = 1;
      let lives = 6;
      let lane = 1;
      let playerX = 0;
      let playerY = 0;
      let invulnerable = 0;
      let stunTime = 0;
      let elapsed = 0;
      let spawnTimer = 0;
      let bossShotTimer = 0;
      let waterShotTimer = 0;
      let transitionTimer = 0;
      let toastTimer = 0;
      let kills = 0;
      let shots = [];
      let enemyShots = [];
      let enemies = [];
      let particles = [];
      let boss = null;
      let lastFrame = 0;
      let shotCooldown = 0;
      let audioContext = null;
      let musicTimer = null;
      let musicStep = 0;
      let soundEnabled = true;
      let endlessMode = false;
      let endlessScore = 0;
      let speedTicks = 0;

      const speedMultiplier = () => 1 + speedTicks * 0.05;

      const melody = [659, 784, 988, 784, 880, 784, 659, 523, 587, 659, 784, 659, 587, 523, 587, 659];

      function ensureAudio() {
        if (!soundEnabled) return false;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          soundEnabled = false;
          soundToggle.textContent = "🔇 おと";
          soundToggle.setAttribute("aria-pressed", "false");
          showMessage("このブラウザーでは音がでないよ", 2.4);
          return false;
        }
        if (!audioContext) audioContext = new AudioContextClass();
        if (audioContext.state === "suspended") audioContext.resume();
        return true;
      }

      function playTone(frequency, duration, type = "sine", volume = 0.08, delay = 0) {
        if (!ensureAudio()) return;
        const start = audioContext.currentTime + delay;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.02);
      }

      function playEffect(effect) {
        const effects = {
          shoot: [880, 0.09, "triangle", 0.035],
          pop: [1047, 0.16, "sine", 0.06],
          hit: [220, 0.22, "triangle", 0.075],
          water: [523, 0.28, "sine", 0.08],
          boss: [784, 0.35, "square", 0.045],
          clear: [988, 0.32, "triangle", 0.06]
        };
        const tone = effects[effect];
        if (tone) playTone(...tone);
        if (effect === "boss" || effect === "clear") {
          playTone(effect === "boss" ? 988 : 1319, 0.32, "triangle", 0.05, 0.12);
          playTone(effect === "boss" ? 1175 : 1568, 0.4, "sine", 0.05, 0.24);
        }
      }

      function startMusic() {
        if (mode === "menu" || mode === "gameover" || mode === "clear") return;
        if (!ensureAudio() || musicTimer !== null) return;
        musicStep = 0;
        const tick = () => {
          if (!soundEnabled || mode === "menu" || mode === "gameover" || mode === "clear") return;
          const note = melody[musicStep % melody.length];
          playTone(note, 0.19, "triangle", 0.025);
          if (musicStep % 4 === 0) playTone(note / 2, 0.34, "sine", 0.018);
          musicStep += 1;
        };
        tick();
        musicTimer = window.setInterval(tick, 260);
      }

      function stopMusic() {
        if (musicTimer !== null) {
          window.clearInterval(musicTimer);
          musicTimer = null;
        }
      }

      function toggleSound() {
        soundEnabled = !soundEnabled;
        soundToggle.textContent = soundEnabled ? "🔊 おと" : "🔇 おと";
        soundToggle.setAttribute("aria-pressed", String(soundEnabled));
        if (soundEnabled) startMusic();
        else stopMusic();
      }

      const laneX = (value) => width * (value + 0.5) / 3;
      const targetKills = () => stage === 1 ? 5 : 7;
      const currentPlayerY = () => height * 0.79;

      function resize() {
        const rect = canvas.getBoundingClientRect();
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = rect.width;
        height = rect.height;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        playerX = laneX(lane);
        playerY = currentPlayerY();
      }

      function showOverlay(title, text, buttonText, action, secondaryText = "", secondaryAction = null) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        overlayButton.textContent = buttonText;
        overlayButton.onclick = action;
        overlaySecondaryButton.hidden = !secondaryAction;
        if (secondaryAction) {
          overlaySecondaryButton.textContent = secondaryText;
          overlaySecondaryButton.onclick = secondaryAction;
        }
        overlay.hidden = false;
      }

      function showMessage(text, seconds = 1.6) {
        message.textContent = text;
        message.hidden = false;
        toastTimer = seconds;
      }

      function startStage(nextStage, startingLives) {
        stage = nextStage;
        lives = startingLives;
        lane = 1;
        playerX = laneX(lane);
        playerY = currentPlayerY();
        invulnerable = 0;
        stunTime = 0;
        elapsed = 0;
        spawnTimer = 1.2;
        bossShotTimer = 0;
        waterShotTimer = 3.5;
        transitionTimer = 0;
        toastTimer = 0;
        kills = 0;
        shots = [];
        enemyShots = [];
        enemies = [];
        particles = [];
        boss = null;
        shotCooldown = 0;
        message.hidden = true;
        overlay.hidden = true;
        mode = "playing";
        startMusic();
        showMessage(stage === 1 ? "ステージ１　そらのうえ" : "ステージ２　ロボットのしま", 2);
      }

      function startNewGame() {
        endlessMode = false;
        endlessScore = 0;
        speedTicks = 0;
        startStage(1, 6);
      }

      function startEndlessMode() {
        endlessMode = true;
        endlessScore = 0;
        speedTicks = 0;
        startStage(1, 6);
        showMessage("エンドレス！　たおしてハートをあつめよう！", 2.5);
      }

      function awardEndlessPoints(points) {
        if (!endlessMode) return;
        endlessScore += points;
        lives = Math.min(6, lives + 1);
        for (let i = 0; i < points; i++) {
          if (speedTicks === 80) speedTicks = 0;
          else speedTicks += 1;
        }
      }

      function laneFromPointer(event) {
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        return Math.max(0, Math.min(2, Math.floor(x / (rect.width / 3))));
      }

      function actInLane(nextLane) {
        if (mode !== "playing") return;
        lane = nextLane;
        if (shotCooldown <= 0) {
          shots.push({ lane, y: playerY - 30, speed: Math.max(420, height * 0.9) });
          playEffect("shoot");
          shotCooldown = 0.22;
        }
      }

      function spawnEnemy(laneIndex) {
        enemies.push({
          lane: laneIndex,
          y: -28,
          speed: height * (stage === 1 ? 0.19 : 0.24),
          fireTimer: 1.2 + Math.random() * 1.4,
          wobble: Math.random() * TAU
        });
      }

      function beginBoss() {
        boss = stage === 1
          ? {
              kind: "ufo", hp: 12, maxHp: 12, y: height * 0.24, blink: 0,
                lane: 1, targetLane: 2, direction: 1,
                pauseState: "moving", pauseTimer: 2.5
            }
          : {
              kind: "robot",
              phase: "arms",
              armHp: [2, 2],
              headHp: 3,
              coreHp: 12,
              maxCoreHp: 12,
              phaseTimer: 0,
              y: height * 0.24,
              blink: 0
            };
        bossShotTimer = 0.8 * 1.3;
        waterShotTimer = 4 * 1.3;
        playEffect("boss");
        showMessage(stage === 1 ? "ボス！　ノロロUFOだ！" : "ボス！　ギガボットだ！", 2.2);
      }

      function burst(x, y, color) {
        for (let i = 0; i < 10; i++) {
          const angle = TAU * i / 10;
          particles.push({
            x, y,
            vx: Math.cos(angle) * (30 + Math.random() * 60),
            vy: Math.sin(angle) * (30 + Math.random() * 60),
            life: 0.45,
            color
          });
        }
      }

      function damagePlayer(water) {
        if (invulnerable > 0 || mode !== "playing") return;
        lives -= 1;
        playEffect(water ? "water" : "hit");
        invulnerable = 1.3;
        burst(playerX, playerY, water ? "#91f4ff" : "#ffbd68");
        if (lives <= 0) {
          mode = "gameover";
          stopMusic();
          const retryAction = endlessMode
            ? startEndlessMode
            : () => startStage(stage, 6);
          showOverlay(
            "もういっかい！",
            endlessMode
              ? `スコア ${endlessScore}！　もういちど エンドレスに ちょうせん！`
              : `ステージ${stage}の はじめから もういちど あそべるよ。`,
            endlessMode ? "もういちど" : "つづける",
            retryAction
          );
          return;
        }
        if (water) {
          mode = "stun";
          stunTime = 1.8;
          showMessage("ピピがキラリバッジをとどけるよ！", 1.8);
        } else {
          showMessage("だいじょうぶ！　きをつけて！", 1.1);
        }
      }

      function shootBoss() {
        if (!boss) return;
        if (boss.kind === "ufo") {
          const targetLane = Math.floor(Math.random() * 3);
          enemyShots.push({
            lane: targetLane,
            y: boss.y + height * 0.08,
            speed: height * 0.32,
            kind: "spark"
          });
        } else {
          const safeLane = Math.floor(Math.random() * 3);
          for (let i = 0; i < 3; i++) {
            if (i !== safeLane) {
              enemyShots.push({
                lane: i,
                y: boss.y + height * 0.1,
                speed: height * 0.4,
                kind: "spark"
              });
            }
          }
        }
      }

      function shootWater() {
        if (!boss) return;
        enemyShots.push({
          lane: Math.floor(Math.random() * 3),
          y: boss.y + height * 0.1,
          speed: height * 0.3,
          kind: "bubble"
        });
      }

      function hitRobot(laneIndex) {
        if (boss.phase === "arms") {
          if (laneIndex === 0 && boss.armHp[0] > 0) {
            boss.armHp[0] -= 1;
            burst(width / 6, boss.y + 48, "#ffb353");
          } else if (laneIndex === 2 && boss.armHp[1] > 0) {
            boss.armHp[1] -= 1;
            burst(width * 5 / 6, boss.y + 48, "#ffb353");
          }
          if (boss.armHp[0] <= 0 && boss.armHp[1] <= 0) {
            boss.phase = "head";
            showMessage("りょううでをこわした！　まんなかをねらおう！", 2.2);
          }
        } else if (boss.phase === "head" && laneIndex === 1) {
          boss.headHp -= 1;
          burst(laneX(1), boss.y + 30, "#a7f5ff");
          if (boss.headHp <= 0) {
            boss.phase = "core";
            boss.phaseTimer = 5;
            showMessage("よわいところがでた！　まんなかをタップ！", 2.4);
          }
        } else if (boss.phase === "core" && laneIndex === 1) {
          boss.coreHp -= 1;
          burst(laneX(1), boss.y + 82, "#fff27c");
          if (boss.coreHp <= 0) {
            finishStage();
          }
        }
      }

      function finishStage() {
        playEffect("clear");
        if (endlessMode) awardEndlessPoints(stage === 1 ? 5 : 10);
        if (stage === 1) {
          mode = "transition";
          transitionTimer = 2.3;
          boss = null;
          enemies = [];
          enemyShots = [];
          shots = [];
          showMessage("やったー！　つぎのステージへ！", 2.3);
        } else if (endlessMode) {
          mode = "transition";
          transitionTimer = 2.3;
          boss = null;
          enemies = [];
          enemyShots = [];
          shots = [];
          showMessage(`ロボット撃破！ スコア ${endlessScore}！`, 2.3);
        } else {
          mode = "clear";
          stopMusic();
          boss = null;
          showOverlay(
            "やったね！",
            "ポポといっしょに そらのへいわをまもったよ！",
            "もういちどあそぶ",
            startNewGame,
            "エンドレスへ",
            startEndlessMode
          );
        }
      }

      function update(dt) {
        for (const star of stars) {
          star.y += star.speed * dt / Math.max(height, 1);
          if (star.y > 1) star.y -= 1;
        }
        if (toastTimer > 0) {
          toastTimer -= dt;
          if (toastTimer <= 0) message.hidden = true;
        }
        if (mode !== "playing" && mode !== "stun" && mode !== "transition") return;
        const gameDt = dt * (endlessMode ? speedMultiplier() : 1);
        elapsed += gameDt;
        playerX += (laneX(lane) - playerX) * Math.min(1, gameDt * 12);
        playerY = currentPlayerY();
        invulnerable = Math.max(0, invulnerable - gameDt);
        shotCooldown = Math.max(0, shotCooldown - gameDt);

        if (mode === "transition") {
          transitionTimer -= gameDt;
          if (transitionTimer <= 0) startStage(endlessMode && stage === 2 ? 1 : 2, lives);
          return;
        }
        if (mode === "stun") {
          stunTime -= gameDt;
          if (stunTime <= 0) {
            mode = "playing";
            showMessage("ピピのバッジで げんきいっぱい！", 1.5);
          }
          return;
        }

        if (!boss) {
          spawnTimer -= gameDt;
          if (spawnTimer <= 0 && kills < targetKills()) {
            spawnEnemy(Math.floor(Math.random() * 3));
            if (stage === 2 && kills < targetKills() - 2 && Math.random() < 0.35) {
              spawnEnemy(Math.floor(Math.random() * 3));
            }
            spawnTimer = stage === 1 ? 1.35 : 1.05;
          }
          if (kills >= targetKills() && enemies.length === 0) beginBoss();
        }

        if (boss) {
          boss.blink = Math.max(0, boss.blink - gameDt);
          if (boss.kind === "ufo") {
            boss.pauseTimer -= gameDt;
            if (boss.pauseState === "moving") {
              const distance = boss.targetLane - boss.lane;
              boss.lane += Math.sign(distance) * Math.min(Math.abs(distance), gameDt * 1.2);
              if (boss.pauseTimer <= 0) {
                boss.pauseState = "warning";
                boss.pauseTimer = 0.7;
              }
            } else if (boss.pauseTimer <= 0 && boss.pauseState === "warning") {
              boss.pauseState = "resting";
              boss.pauseTimer = 1.8;
            } else if (boss.pauseTimer <= 0 && boss.pauseState === "resting") {
              boss.pauseState = "moving";
              boss.pauseTimer = 2.5;
              if (boss.targetLane === 0 || boss.targetLane === 2) boss.direction *= -1;
              boss.targetLane += boss.direction;
            }
          }
          const ufoResting = boss.kind === "ufo" && boss.pauseState === "resting";
          const robotExposingCore = boss.kind === "robot" && boss.phase === "core";
          if (!ufoResting && !robotExposingCore) {
            bossShotTimer -= gameDt;
            waterShotTimer -= gameDt;
            if (bossShotTimer <= 0) {
              shootBoss();
              bossShotTimer = (stage === 1 ? 0.9 : 1.15) * 1.3;
            }
            if (waterShotTimer <= 0) {
              shootWater();
              waterShotTimer = (stage === 1 ? 4.6 : 3.8) * 1.3;
            }
          }
          if (boss.kind === "robot" && boss.phase === "core") {
            boss.phaseTimer -= gameDt;
            if (boss.phaseTimer <= 0) {
              boss.phase = "arms";
              boss.armHp = [2, 2];
              boss.headHp = 3;
              showMessage("ギガボットが うでをなおした！", 1.8);
            }
          }
        }

        for (const enemy of enemies) {
          enemy.y += enemy.speed * gameDt;
          enemy.fireTimer -= gameDt;
          if (enemy.fireTimer <= 0) {
            enemyShots.push({
              lane: enemy.lane,
              y: enemy.y + 18,
              speed: height * (stage === 1 ? 0.27 : 0.34),
              kind: "spark"
            });
            enemy.fireTimer = 2.1 + Math.random() * 1.1;
          }
        }

        for (let i = shots.length - 1; i >= 0; i--) {
          const shot = shots[i];
          shot.y -= shot.speed * gameDt;
          if (boss && shot.y <= boss.y + height * 0.12) {
            if (boss.kind === "ufo") {
              if (Math.abs(laneX(shot.lane) - laneX(boss.lane)) <= Math.min(width * 0.14, 64) + 8) {
                boss.hp -= 1;
                boss.blink = 0.14;
                burst(laneX(boss.lane), boss.y + 35, "#fff27c");
                  playEffect("pop");
                if (boss.hp <= 0) finishStage();
              }
            } else {
              hitRobot(shot.lane);
            }
            shots.splice(i, 1);
            continue;
          }
          let hit = false;
          for (let j = enemies.length - 1; j >= 0; j--) {
            const enemy = enemies[j];
            if (shot.lane === enemy.lane && Math.abs(shot.y - enemy.y) < 24) {
              burst(laneX(enemy.lane), enemy.y, "#a9fff0");
              playEffect("pop");
              awardEndlessPoints(1);
              enemies.splice(j, 1);
              kills += 1;
              hit = true;
              break;
            }
          }
          if (hit || shot.y < -20) shots.splice(i, 1);
        }

        for (let i = enemyShots.length - 1; i >= 0; i--) {
          const bullet = enemyShots[i];
          bullet.y += bullet.speed * gameDt;
          if (bullet.lane === lane && Math.abs(bullet.y - playerY) < 26) {
            enemyShots.splice(i, 1);
            damagePlayer(bullet.kind === "bubble");
            continue;
          }
          if (bullet.y > height + 30) enemyShots.splice(i, 1);
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          if (enemies[i].y > height + 30) enemies.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const particle = particles[i];
          particle.life -= gameDt;
          particle.x += particle.vx * gameDt;
          particle.y += particle.vy * gameDt;
          if (particle.life <= 0) particles.splice(i, 1);
        }
      }

      function roundedRect(x, y, w, h, radius, color) {
        const r = Math.min(radius, w / 2, h / 2);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        ctx.fill();
      }

      function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "#102d57");
        gradient.addColorStop(0.58, "#275b9c");
        gradient.addColorStop(1, "#8ad7ec");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        for (const star of stars) {
          const x = star.x * width;
          const y = star.y * height;
          ctx.globalAlpha = 0.45 + (star.size % 2) * 0.3;
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(x, y, star.size, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        ctx.setLineDash([14, 18]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#ffffff35";
        for (let i = 1; i < 3; i++) {
          const x = width * i / 3;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        const stripeY = (elapsed * height * 0.22) % 64;
        ctx.strokeStyle = "#ffffff12";
        ctx.lineWidth = 3;
        for (let i = 0; i < 8; i++) {
          const y = (i * 110 + stripeY) % height;
          ctx.beginPath();
          ctx.moveTo(width * 0.08, y);
          ctx.lineTo(width * 0.15, y + 24);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(width * 0.85, y + 35);
          ctx.lineTo(width * 0.93, y + 56);
          ctx.stroke();
        }
      }

      function drawHud() {
        roundedRect(12, 12, 120, 42, 17, "#102955bb");
        ctx.fillStyle = "#fff";
        ctx.font = "800 18px sans-serif";
        ctx.textBaseline = "middle";
        ctx.fillText(`ステージ ${stage}`, 24, 34);
        roundedRect(width - 134, 12, 122, 42, 17, "#102955bb");
        ctx.fillStyle = "#fff";
        ctx.font = "800 19px sans-serif";
        ctx.fillText(`♥ ${lives}`, width - 120, 34);

        if (endlessMode) {
          roundedRect(width / 2 - 92, 59, 184, 28, 13, "#102955bb");
          ctx.fillStyle = "#fff";
          ctx.textAlign = "center";
          ctx.font = "800 14px sans-serif";
          ctx.fillText(`⭐ ${endlessScore}　⚡ ${speedMultiplier().toFixed(2)}倍`, width / 2, 73);
          ctx.textAlign = "start";
        }

        if (boss) {
          const barWidth = Math.min(width * 0.68, 330);
          const barX = (width - barWidth) / 2;
          const barY = endlessMode ? 94 : 64;
          roundedRect(barX, barY, barWidth, 17, 9, "#0d204d");
          let ratio;
          if (boss.kind === "ufo") {
            ratio = boss.hp / boss.maxHp;
          } else if (boss.phase === "core") {
            ratio = boss.coreHp / boss.maxCoreHp;
          } else {
            ratio = boss.phase === "arms"
              ? (boss.armHp[0] + boss.armHp[1]) / 4
              : boss.headHp / 3;
          }
          roundedRect(barX + 3, barY + 3, Math.max(0, (barWidth - 6) * ratio), 11, 6, "#ffdf5b");
        }

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "700 14px sans-serif";
        ctx.fillStyle = "#ffffffa8";
        for (let i = 0; i < 3; i++) {
          ctx.fillText(["ひだり", "まんなか", "みぎ"][i], laneX(i), height - 29);
        }
        ctx.textAlign = "start";
      }

      function drawHero() {
        const x = playerX;
        const y = playerY;
        if (invulnerable > 0 && Math.floor(elapsed * 12) % 2 === 0) return;
        ctx.save();
        ctx.translate(x, y + Math.sin(elapsed * 7) * 3);

        ctx.fillStyle = "#ffce58";
        ctx.beginPath();
        ctx.moveTo(-12, 20);
        ctx.lineTo(-8, 36 + Math.sin(elapsed * 15) * 4);
        ctx.lineTo(0, 24);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(12, 20);
        ctx.lineTo(8, 36 + Math.sin(elapsed * 15 + 1) * 4);
        ctx.lineTo(0, 24);
        ctx.closePath();
        ctx.fill();

        roundedRect(-23, 0, 46, 30, 13, "#42cbbb");
        roundedRect(-17, 7, 34, 19, 9, "#198c9e");
        ctx.fillStyle = "#ffe06a";
        ctx.beginPath();
        ctx.moveTo(0, 8);
        ctx.lineTo(5, 15);
        ctx.lineTo(0, 21);
        ctx.lineTo(-5, 15);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#58e0d3";
        ctx.beginPath();
        ctx.ellipse(0, -14, 24, 25, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#31699b";
        ctx.beginPath();
        ctx.ellipse(0, -17, 17, 16, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#ffffff80";
        ctx.beginPath();
        ctx.ellipse(-6, -24, 5, 3, -0.6, 0, TAU);
        ctx.fill();
        roundedRect(-25, -4, 8, 15, 4, "#ff9a62");
        roundedRect(17, -4, 8, 15, 4, "#ff9a62");
        ctx.restore();
      }

      function drawPlayerHearts() {
        ctx.save();
        ctx.translate(playerX, playerY + Math.sin(elapsed * 7) * 3 + 51);
        roundedRect(-44, -11, 88, 22, 11, "#102955cc");
        ctx.font = "16px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let i = 0; i < 6; i++) {
          ctx.fillStyle = i < lives ? "#ff8ca8" : "#657a99";
          ctx.fillText("♥", (i - 2.5) * 13, 0);
        }
        ctx.restore();
      }

      function drawEnemy(enemy) {
        const x = laneX(enemy.lane);
        const y = enemy.y + Math.sin(elapsed * 5 + enemy.wobble) * 4;
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "#ffab7e";
        ctx.beginPath();
        ctx.ellipse(0, 3, 20, 17, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#f77978";
        ctx.beginPath();
        ctx.moveTo(-13, -8);
        ctx.lineTo(-7, -22);
        ctx.lineTo(-1, -8);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(3, -8);
        ctx.lineTo(11, -22);
        ctx.lineTo(14, -5);
        ctx.fill();
        ctx.fillStyle = "#5a456e";
        ctx.beginPath();
        ctx.arc(-6, 1, 2.3, 0, TAU);
        ctx.arc(6, 1, 2.3, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "#8a4e5b";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 5, 5, 0.2, Math.PI - 0.2);
        ctx.stroke();
        ctx.restore();
      }

      function drawBossSignal(x, y, icon, color) {
        ctx.save();
        ctx.font = "30px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.fillText(icon, x, y);
        ctx.restore();
      }

      function drawUfo() {
        const x = laneX(boss.lane);
        const y = boss.y;
        const radius = Math.min(width * 0.14, 64);
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = boss.blink > 0 ? "#fff" : "#b78bff";
        ctx.beginPath();
        ctx.ellipse(0, 20, radius, 22, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#e6c4ff";
        ctx.beginPath();
        ctx.ellipse(0, 5, radius * 0.6, 25, 0, Math.PI, TAU);
        ctx.fill();
        ctx.fillStyle = "#fff17c";
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.arc(i * radius * 0.35, 21, 4, 0, TAU);
          ctx.fill();
        }
        if (boss.pauseState === "warning") {
          drawBossSignal(0, -43, "💦", "#a7f5ff");
        } else if (boss.pauseState === "resting") {
          drawBossSignal(0, -43, "😮‍💨", "#d6f4ff");
        }
        ctx.restore();
      }

      function drawRobot() {
        const center = laneX(1);
        const armWidth = width * 0.26;
        const bodyWidth = Math.min(width * 0.42, 180);
        const y = boss.y;
        const armColor = boss.blink > 0 ? "#fff" : "#f39a52";
        const bodyColor = boss.blink > 0 ? "#fff" : "#7089d8";

        const armRadius = Math.min(width * 0.065, 28);
        for (const side of [-1, 1]) {
          const armIndex = side < 0 ? 0 : 1;
          const shoulderX = center + side * bodyWidth * 0.39;
          const handX = laneX(armIndex === 0 ? 0 : 2);
          const armY = y + 66;
          const armColor = boss.armHp[armIndex] > 0
            ? (boss.blink > 0 ? "#fff" : "#f39a52")
            : "#58677b";
          const joints = [
            [shoulderX, armY],
            [shoulderX + (handX - shoulderX) * 0.48, armY + 15],
            [handX, armY + 31]
          ];

          ctx.lineCap = "round";
          ctx.lineWidth = armRadius * 1.8;
          ctx.strokeStyle = "#344d83";
          ctx.beginPath();
          ctx.moveTo(joints[0][0], joints[0][1]);
          ctx.lineTo(joints[2][0], joints[2][1]);
          ctx.stroke();
          ctx.lineWidth = armRadius * 1.3;
          ctx.strokeStyle = armColor;
          ctx.beginPath();
          ctx.moveTo(joints[0][0], joints[0][1]);
          ctx.lineTo(joints[2][0], joints[2][1]);
          ctx.stroke();
          for (const [jointX, jointY] of joints) {
            ctx.fillStyle = "#344d83";
            ctx.beginPath();
            ctx.arc(jointX, jointY, armRadius, 0, TAU);
            ctx.fill();
            ctx.fillStyle = armColor;
            ctx.beginPath();
            ctx.arc(jointX, jointY, armRadius * 0.72, 0, TAU);
            ctx.fill();
            ctx.fillStyle = "#ffffff70";
            ctx.beginPath();
            ctx.arc(jointX - armRadius * 0.2, jointY - armRadius * 0.25, armRadius * 0.2, 0, TAU);
            ctx.fill();
          }
        }
        roundedRect(center - bodyWidth / 2, y - 8, bodyWidth, height * 0.28, 34, bodyColor);
        roundedRect(center - bodyWidth * 0.32, y + 10, bodyWidth * 0.64, height * 0.17, 25, "#4f68b7");

        const eyeColor = boss.phase === "core" ? "#fff16e" : "#a7f7ff";
        roundedRect(center - 48, y + 22, 96, 47, 19, "#354c8d");
        ctx.fillStyle = "#e6f5ff";
        ctx.beginPath();
        ctx.arc(center - 20, y + 39, 13, 0, TAU);
        ctx.arc(center + 20, y + 39, 13, 0, TAU);
        ctx.fill();
        ctx.fillStyle = eyeColor;
        ctx.beginPath();
        ctx.arc(center - 20, y + 39, 8, 0, TAU);
        ctx.arc(center + 20, y + 39, 8, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#294375";
        ctx.beginPath();
        ctx.arc(center - 20, y + 40, 3.5, 0, TAU);
        ctx.arc(center + 20, y + 40, 3.5, 0, TAU);
        ctx.fill();
        roundedRect(center - 18, y + 56, 36, 10, 5, "#9db3ed");
        ctx.fillStyle = "#4e679f";
        for (let tooth = -1; tooth <= 1; tooth++) {
          roundedRect(center + tooth * 10 - 2, y + 57, 4, 8, 2, "#4e679f");
        }
        ctx.strokeStyle = "#a7c4ff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(center, y - 8);
        ctx.lineTo(center, y - 20);
        ctx.stroke();
        ctx.fillStyle = "#ffcf57";
        ctx.beginPath();
        ctx.arc(center, y - 23, 5, 0, TAU);
        ctx.fill();

        if (boss.phase === "core") {
          drawBossSignal(center, y - 40, "💦", "#a7f5ff");
          ctx.strokeStyle = "#fff17c";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(center, y + 46, 61 + Math.sin(elapsed * 8) * 4, 0, TAU);
          ctx.stroke();
        }
      }

      function drawShots() {
        for (const shot of shots) {
          const x = laneX(shot.lane);
          ctx.fillStyle = "#fff17c";
          ctx.beginPath();
          ctx.ellipse(x, shot.y, 8, 15, 0, 0, TAU);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(x, shot.y - 4, 3, 0, TAU);
          ctx.fill();
        }
        for (const bullet of enemyShots) {
          const x = laneX(bullet.lane);
          ctx.fillStyle = bullet.kind === "bubble" ? "#8ef4ff" : "#ff8ca8";
          ctx.beginPath();
          ctx.arc(x, bullet.y, bullet.kind === "bubble" ? 13 : 9, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = "#ffffffb0";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      function drawParticles() {
        for (const particle of particles) {
          ctx.globalAlpha = Math.max(0, particle.life / 0.45);
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, 4, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function draw() {
        if (!width || !height) return;
        drawBackground();
        drawHud();
        if (boss) {
          if (boss.kind === "ufo") drawUfo();
          else drawRobot();
        }
        for (const enemy of enemies) drawEnemy(enemy);
        drawShots();
        drawParticles();
        drawHero();
        drawPlayerHearts();
      }

      function frame(timestamp) {
        const dt = Math.min((timestamp - lastFrame) / 1000 || 0, 0.04);
        lastFrame = timestamp;
        update(dt);
        draw();
        window.requestAnimationFrame(frame);
      }

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        actInLane(laneFromPointer(event));
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft" || event.key === "1") {
          event.preventDefault();
          actInLane(Math.max(0, lane - 1));
        } else if (event.key === "ArrowRight" || event.key === "3") {
          event.preventDefault();
          actInLane(Math.min(2, lane + 1));
        } else if (event.key === "ArrowDown" || event.key === "2" || event.key === " ") {
          event.preventDefault();
          actInLane(1);
        }
      });

      window.addEventListener("resize", resize);
      overlayButton.onclick = startNewGame;
      soundToggle.addEventListener("click", toggleSound);
      resize();
      window.requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
