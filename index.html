<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf8ff">
  <title>そらいろゲームのひろば</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      color: #24415c;
      background: #eaf8ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 20%, #fff 0 5px, transparent 6px),
        radial-gradient(circle at 83% 25%, #fff 0 8px, transparent 9px),
        linear-gradient(160deg, #eaf8ff, #d5f0ff 55%, #f6fbff);
    }

    main {
      width: min(100%, 620px);
      padding: clamp(28px, 7vw, 56px);
      border: 4px solid #fff;
      border-radius: 36px;
      background: #ffffffd9;
      box-shadow: 0 18px 48px #69a9cf30;
      text-align: center;
    }

    .mark {
      width: 108px;
      height: 108px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border: 6px solid #fff;
      border-radius: 38px;
      background: linear-gradient(145deg, #86e6db, #64b8f2);
      box-shadow: 0 8px 0 #b7dff3;
      font-size: 56px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      letter-spacing: .06em;
    }

    p {
      margin: 16px 0 30px;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    a {
      min-height: 72px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 30px;
      border: 4px solid #fff;
      border-radius: 24px;
      background: #ffcb59;
      box-shadow: 0 7px 0 #eaa739;
      color: #593d18;
      font-size: 1.35rem;
      font-weight: 800;
      text-decoration: none;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    a:hover { transform: translateY(-2px); }
    a:active { transform: translateY(5px); box-shadow: 0 2px 0 #eaa739; }
    a:focus-visible { outline: 4px solid #3288d2; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⭐</div>
    <h1>そらいろゲームのひろば</h1>
    <p>ちいさな冒険に出発しよう！<br>あそびたいゲームをえらんでね。</p>
    <a href="./games/popo-sky-trip/index.html">
      <span aria-hidden="true">🚀</span>
      <span>ポポのそらたび</span>
    </a>
  </main>
</body>
</html>
